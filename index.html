const up=(file,path,type,bar)=>new Promise((ok,no)=>{const r=sref(st,path),t=uploadBytesResumable(r,file,{contentType:type||file.type});let g;
 const arm=()=>{clearTimeout(g);g=setTimeout(()=>{t.cancel();no(Error("timeout"))},20000)};arm();
 t.on("state_changed",x=>{arm();bar.hidden=false;bar.value=x.bytesTransferred/x.totalBytes*100},e=>{clearTimeout(g);no(e)},()=>{clearTimeout(g);ok(r)})});
const T=(p,ms,m)=>Promise.race([p,new Promise((_,no)=>setTimeout(()=>no(Error(m)),ms))]);
const say=(m,bad)=>{const e=$("#fst");if(e){e.style.color=bad?"#FF8A9E":"";e.textContent=m}};
const shrink=async(f,m)=>{try{const b=await createImageBitmap(f),k=Math.min(1,m/Math.max(b.width,b.height)),c=document.createElement("canvas");c.width=Math.round(b.width*k);c.height=Math.round(b.height*k);
 const x=c.getContext("2d");x.fillStyle="#fff";x.fillRect(0,0,c.width,c.height);x.drawImage(b,0,0,c.width,c.height);return await new Promise(r=>c.toBlob(r,"image/jpeg",.85))||f}catch{return f}};
const imgbb=async(f,m)=>{if(IMGBB_KEY.startsWith("PASTE"))throw Error("Add your ImgBB API key (IMGBB_KEY) in the script");
 if(!/^image\/(png|jpeg|webp)$/.test(f.type)||f.size>10485760)throw Error("Images must be PNG, JPG or WebP under 10 MB");
 const d=new FormData();d.append("image",await shrink(f,m),"image.jpg");const ac=new AbortController(),t=setTimeout(()=>ac.abort(),45000);
 try{const j=await(await fetch("https://api.imgbb.com/1/upload?key="+IMGBB_KEY,{method:"POST",body:d,signal:ac.signal})).json();
  if(!j.success)throw Error(j.error?.message||"ImgBB rejected the image");return j.data.url}
 catch(x){throw Error(x.name==="AbortError"?"ImgBB did not respond within 45 seconds. Check your connection and API key.":x.message==="Failed to fetch"?"Could not reach ImgBB. Check your connection or any ad blocker.":x.message)}
 finally{clearTimeout(t)}};

  try{say("Checking...");const NE="Cannot reach the database. Check CFG.databaseURL (region) and your connection.";const old=E?await T(val(`apps/${me.uid}/${E}`),12000,NE):{},pf=await T(val("devProfiles/"+me.uid),12000,NE);
   if(!pf)throw Error("Save your developer profile first");
   say("Checking...");const id=E||push(ref(db,"apps/"+me.uid)).key,vc=Math.floor(+f.vc.value),apk=f.apk.files[0],link=f.link.value.trim(),ic=f.icon.files[0],sh=[...f.shots.files].slice(0,6);

   if(apk||link){if(old.versionCode&&vc<=old.versionCode)throw Error("Version code must be higher than "+old.versionCode)}

   if(apk){say("Uploading APK...");

    const h=new Uint8Array(await apk.slice(0,4).arrayBuffer());if(h[0]!==0x50||h[1]!==0x4B)throw Error("This file is not a valid APK (zip) archive");
